<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>ShopAI Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/assistant.css}">

</head>

<body>

<div class="background-glow"></div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="shop-card">

                <!-- HEADER -->

                <div class="header-section text-center">

                    <div class="robot-circle">

                        <i class="bi bi-robot"></i>

                    </div>

                    <h1 class="logo-title">

                        Shop<span>AI</span>

                    </h1>

                    <p class="subtitle">

                        Your Personal AI Shopping Expert

                    </p>

                </div>

                <!-- USER -->

                <div class="user-card">

                    <div>

                        <h5>

                            <i class="bi bi-person-circle"></i>

                            Welcome,

                            <span th:text="${user.name}"></span>

                        </h5>

                        <small>

                            Ask anything about shopping,
                            products,
                            comparisons,
                            recommendations,
                            budgets and brands.

                        </small>

                    </div>

                </div>

                <!-- FORM -->

                <form action="/ask" method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <input
                            type="hidden"
                            name="userId"
                            th:value="${user.id}">

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-stars"></i>

                            Ask ShopAI

                        </label>

                        <textarea

                                class="form-control"

                                rows="6"

                                name="question"

                                placeholder="Example:
Suggest a gaming keyboard under ₹5000 with RGB lighting...">

                        </textarea>

                    </div>

                    <div class="d-grid">

                        <button
                                class="btn btn-ai"
                                type="submit">

                            <i class="bi bi-send-fill"></i>

                            Ask AI

                        </button>

                    </div>

                </form>

                <!-- RESPONSE -->

                <!-- CHAT HISTORY -->

                <div class="mt-5" th:if="${!#lists.isEmpty(chatHistory)}">

                    <div th:each="chat : ${chatHistory}">

                        <!-- USER -->

                        <div class="response-card mb-4" th:if="${chat.role == 'USER'}">

                            <div class="response-header">

                                <i class="bi bi-person-fill"></i>

                                You

                            </div>

                            <div class="response-content">

                                <p th:text="${chat.message}"></p>

                            </div>

                        </div>

                        <!-- AI -->

                        <div class="response-card mb-4" th:if="${chat.role == 'AI'}">

                            <div class="response-header">

                                <i class="bi bi-robot"></i>

                                ShopAI

                            </div>

                            <div class="response-content"
                                 th:utext="${chat.message}">

                            </div>

                        </div>

                    </div>

                </div>

                <!-- FOOTER -->

                <div class="footer-buttons">

                    <a

                            class="btn btn-home"

                            th:href="@{/assistant/exit/{userId}(userId=${user.id})}">

                        <i class="bi bi-house-door-fill"></i>

                        Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
