<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ShopAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>

<body>

<div class="background-glow"></div>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg top-navbar">

    <div class="container">

        <a class="navbar-brand logo" href="#">
            Shop<span>AI</span>
        </a>

        <button class="navbar-toggler bg-warning"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse justify-content-end"
             id="navbarNav">

            <ul class="navbar-nav align-items-center">

                <li class="nav-item me-3">
                    <a class="nav-link"
                       th:href="@{/home/{id}(id=${user.id})}">
                        Home
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ================= HERO ================= -->

<section class="hero-section">

    <div class="container">

        <div class="hero-card">

            <h1>My Profile</h1>

            <p>
                Manage your personal information and shopping preferences.
            </p>

        </div>

    </div>

</section>

<!-- ================= MAIN ================= -->

<div class="container py-5">

    <div class="row g-4">

        <!-- PERSONAL INFORMATION -->

        <div class="col-lg-6">

            <div class="profile-card">

                <h3>

                    <i class="bi bi-person-circle"></i>

                    Personal Information

                </h3>

                <div class="info-item">

                    <span class="label">

                        <i class="bi bi-person-fill"></i>

                        Name

                    </span>

                    <span class="value"
                          th:text="${user.name}">
                    </span>

                </div>

                <div class="info-item">

                    <span class="label">

                        <i class="bi bi-envelope-fill"></i>

                        Email

                    </span>

                    <span class="value"
                          th:text="${user.email}">
                    </span>

                </div>

            </div>

        </div>

        <!-- SHOPPING PREFERENCES -->

        <div class="col-lg-6">

            <div class="profile-card">

                <h3>

                    <i class="bi bi-stars"></i>

                    Shopping Preferences

                </h3>
                <div class="info-item">

                    <span class="label">

                        <i class="bi bi-grid-fill"></i>

                        Preferred Category

                    </span>

                    <span class="value"
                          th:text="${preference.preferredCategory}">

                    </span>

                </div>

                <div class="info-item">

                    <span class="label">

                        <i class="bi bi-award-fill"></i>

                        Preferred Brand

                    </span>

                    <span class="value"
                          th:text="${preference.preferredBrand}">

                    </span>

                </div>

                <div class="info-item">

                    <span class="label">

                        <i class="bi bi-currency-rupee"></i>

                        Maximum Budget

                    </span>

                    <span class="value budget-tag">

                        ₹<span th:text="${preference.maxBudget}"></span>

                    </span>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= BUTTONS ================= -->

    <div class="text-center mt-5">

        <button
                class="btn btn-warning btn-lg rounded-pill px-5 me-3"
                data-bs-toggle="modal"
                data-bs-target="#editPreferenceModal">

            <i class="bi bi-pencil-square"></i>

            Edit Preferences

        </button>

        <a class="btn btn-outline-warning btn-lg rounded-pill px-5"
           th:href="@{/home/{id}(id=${user.id})}">

            <i class="bi bi-house-fill"></i>

            Back Home

        </a>

    </div>

</div>

<!-- ===========================================
            EDIT PREFERENCE MODAL
=========================================== -->

<div class="modal fade"
     id="editPreferenceModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content edit-modal">

            <div class="modal-header">

                <h3 class="modal-title">

                    <i class="bi bi-sliders"></i>

                    Edit Shopping Preferences

                </h3>

                <button class="btn-close"
                        data-bs-dismiss="modal"></button>

            </div>

            <form
                    th:action="@{/profile/updatePreference}"
                    method="post">

                <div class="modal-body">

                    <input type="hidden"
                           name="userId"
                           th:value="${user.id}">

                    <!-- Category -->

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-grid"></i> Preferred Category
                        </label>

                        <select id ="category"
                                class="form-select profile-select"
                                name="preferredCategory"
                                required>

                            <option th:each="category : ${categories}"
                                    th:value="${category}"
                                    th:text="${category}"
                                    th:selected="${category == preference.preferredCategory}">
                            </option>

                        </select>
                    </div>

                    <!-- Brand -->

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-award"></i> Preferred Brand
                        </label>

                        <select id="brand"
                                class="form-select profile-select"
                                name="preferredBrand"
                                required>

                            <option th:each="brand : ${brands}"
                                    th:value="${brand}"
                                    th:text="${brand}"
                                    th:selected="${brand == preference.preferredBrand}">
                            </option>

                        </select>
                    </div>

                    <!-- Budget -->

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-cash-stack"></i> Maximum Budget
                        </label>

                        <input type="number"
                               class="form-control profile-input"
                               name="maxBudget"
                               step="0.01"
                               min="0"
                               th:value="${preference.maxBudget}"
                               required>
                    </div>

                </div>

                <div class="modal-footer">

                    <button
                            class="btn btn-secondary"

                            data-bs-dismiss="modal"

                            type="button">

                        Cancel

                    </button>

                    <button
                            type="submit"

                            class="btn btn-warning">

                        <i class="bi bi-check-circle"></i>

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Your JavaScript -->
<script>

    const category = document.getElementById("category");
    const brand = document.getElementById("brand");

    category.addEventListener("change", function () {

        fetch("/brands?category=" + encodeURIComponent(this.value))
            .then(response => response.json())
            .then(data => {

                brand.innerHTML = "";

                const first = document.createElement("option");
                first.textContent = "Select Brand";
                first.value = "";
                brand.appendChild(first);

                data.forEach(function(item){

                    const option = document.createElement("option");
                    option.value = item;
                    option.textContent = item;
                    brand.appendChild(option);

                });

            });

    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
